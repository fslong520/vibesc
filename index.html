<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeSc - 智搭</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 菜单栏 -->
      <div id="menu-bar">
        <div class="menu-left">
          <div class="logo">智搭</div>
          <div class="menu-items">
            <span class="menu-item" data-menu="file">文件</span>
            <span class="menu-item" data-menu="edit">编辑</span>
            <span class="menu-item" data-menu="tutorials">教程</span>
            <span class="menu-item" data-menu="settings">设置</span>
          </div>
        </div>
        <div class="menu-center">
          <span id="project-name" contenteditable="true">未命名项目</span>
        </div>
        <div class="menu-right">
          <button id="btn-open" class="menu-btn">打开</button>
          <button id="btn-save" class="menu-btn">保存</button>
          <button id="btn-share" class="menu-btn menu-btn-primary">分享</button>
        </div>
        <!-- 隐藏文件输入，用于 .sb3 导入 -->
        <input type="file" id="file-input" accept=".sb3" style="display:none" />
      </div>

      <!-- 主编辑区：scratch-gui 托管 -->
      <div id="editor-area">
        <div id="scratch-gui-mount"></div>
      </div>

      <!-- 底部面板 -->
      <div id="bottom-panel">
        <div class="bottom-panel-header">
          <div class="bottom-tabs" id="bottom-tabs">
            <span class="bottom-tab active" data-panel="ai-chat">
              💬 AI 对话
            </span>
            <span class="bottom-tab" data-panel="material-workshop">
              🎨 素材工坊
            </span>
            <span class="bottom-tab" data-panel="hardware">
              🔧 硬件
            </span>
            <span class="bottom-tab" data-panel="plugins">
              🧩 插件
            </span>
          </div>
          <div class="bottom-panel-actions">
            <button id="btn-fold-panel" title="折叠">▼</button>
          </div>
        </div>
        <div class="bottom-panel-body">
          <div class="panel-content active" id="panel-ai-chat">
            <!-- AI 对话 -->
            <div class="chat-messages" id="chat-messages">
              <div class="chat-message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">你好！我是智搭助手。我可以帮你写积木、生成图片、检查代码。试试看！</div>
              </div>
            </div>
            <div class="chat-input-area">
              <div id="skill-switcher"></div>
              <textarea id="chat-input" placeholder="说你想做什么…" rows="2"></textarea>
              <button id="btn-send" class="btn-send">发送</button>
            </div>
          </div>
          <div class="panel-content" id="panel-material-workshop">
            <!-- 素材工坊 -->
            <div class="workshop-toolbar">
              <button class="ws-btn" data-tool="rotate-left" title="左旋 90°">↺</button>
              <button class="ws-btn" data-tool="rotate-right" title="右旋 90°">↻</button>
              <button class="ws-btn" data-tool="flip-h" title="水平翻转">⇔</button>
              <button class="ws-btn" data-tool="flip-v" title="垂直翻转">⇕</button>
              <span class="ws-sep"></span>
              <button class="ws-btn" data-tool="apply-crop" title="裁剪">✂ 裁剪</button>
              <button class="ws-btn" data-tool="cancel-crop" title="取消裁剪">✕ 取消</button>
              <span class="ws-sep"></span>
              <button class="ws-btn" data-tool="discard" title="放弃更改">↩ 重置</button>
              <button class="ws-btn ws-btn-primary" data-tool="apply" title="应用到舞台">✓ 应用</button>
            </div>
            <div class="workshop-canvas-wrap">
              <canvas id="ws-canvas" class="workshop-canvas"></canvas>
            </div>
          </div>
          <div class="panel-content" id="panel-hardware">
            <!-- 硬件 -->
            <div class="hardware-toolbar">
              <select id="hardware-port-select">
                <option value="">选择串口...</option>
              </select>
              <button id="btn-connect-hardware" class="menu-btn">连接</button>
              <button id="btn-scan-ports" class="menu-btn menu-btn-secondary">扫描</button>
            </div>
            <div class="hardware-status" id="hardware-status">
              未连接
            </div>
          </div>
          <div class="panel-content" id="panel-plugins">
            <!-- 插件 -->
            <div class="plugins-toolbar">
              <button id="btn-load-plugin" class="menu-btn">加载插件</button>
              <button id="btn-open-plugin-folder" class="menu-btn menu-btn-secondary">打开插件目录</button>
            </div>
            <div class="plugin-list" id="plugin-list">
              <p class="text-muted">暂无插件。点击"加载插件"选择 .zhplugin 文件安装</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- fetch-worker monkey-patch: 必须在任何 import scratch-gui 的模块之前执行 -->
    <script>
    (function patchWorker() {
      var OrigWorker = window.Worker;
      if (!OrigWorker) return;
      window.Worker = function Worker(url, options) {
        var urlStr = typeof url === 'string' ? url : (url instanceof URL ? url.href : '');
        if (urlStr.indexOf('fetch-worker') !== -1) {
          throw new Error('[VibeSc] fetch-worker chunk unavailable');
        }
        return new OrigWorker(url, options);
      };
      window.Worker.prototype = OrigWorker.prototype;
    })();

    // AudioContext 单例 + console.warn 压制
    (function() {
      var _sharedAC = null;
      var _OrigAC = window.AudioContext;
      var _OrigWAC = window.webkitAudioContext;
      function _getAC() {
        if (!_sharedAC) { try { _sharedAC = new (_OrigAC || _OrigWAC)(); } catch (_) {} }
        return _sharedAC;
      }
      if (_OrigAC) {
        function _PAC() { return _getAC(); }
        _PAC.prototype = _OrigAC.prototype;
        try { Object.defineProperty(_PAC, 'prototype', { value: _OrigAC.prototype }); } catch (_) {}
        window.AudioContext = _PAC;
      }
      if (_OrigWAC) {
        function _PWAC() { return _getAC(); }
        _PWAC.prototype = _OrigWAC.prototype;
        try { Object.defineProperty(_PWAC, 'prototype', { value: _OrigWAC.prototype }); } catch (_) {}
        window.webkitAudioContext = _PWAC;
      }
      // 首次交互时 resume
      function _onInteraction() {
        if (_sharedAC && _sharedAC.state === 'suspended') _sharedAC.resume().catch(function(){});
        document.removeEventListener('pointerdown', _onInteraction, true);
        document.removeEventListener('keydown', _onInteraction, true);
      }
      document.addEventListener('pointerdown', _onInteraction, true);
      document.addEventListener('keydown', _onInteraction, true);
      // console.warn 过滤所有含 AudioContext 的消息
      var _w = window.console.warn.bind(window.console);
      window.console.warn = function() {
        for (var i = 0; i < arguments.length; i++) {
          var a = arguments[i];
          if (typeof a === 'string') {
            if (a.indexOf('AudioContext') >= 0) return;
            if (a.indexOf('Canvas2D') >= 0) return;
          }
        }
        _w.apply(window.console, arguments);
      };
    })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
